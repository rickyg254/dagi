<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pastry Ordering Assistant</title>
  <style>
    :root {
      --bg: #fff8f4;
      --card: #ffffff;
      --border: #ecdde5;
      --accent: #8d4b6e;
      --accent-soft: #f8e8f0;
      --text: #2f2430;
      --muted: #7f6a7b;
      --good: #247242;
      --warn: #8b4e18;
      --warn-bg: #fff4e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg), #ffeef8);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 12px;
    }
    .app {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(90, 40, 68, 0.08);
      padding: 16px;
    }
    h1 { margin: 0; font-size: 1.7rem; }
    .subtitle { color: var(--muted); margin-top: 8px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }
    .item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .item h3 { margin: 0; font-size: 1rem; }
    .price { color: var(--muted); margin: 6px 0 10px; }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-controls button {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 1rem;
    }
    .qty-badge { font-weight: 600; min-width: 20px; text-align: center; }
    .field { margin-bottom: 10px; }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      color: inherit;
      background: #fff;
    }
    textarea { min-height: 90px; resize: vertical; }
    .actions { display: flex; gap: 8px; }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--accent-soft); color: var(--accent); }
    .summary-list { list-style: none; margin: 0; padding: 0; }
    .summary-list li {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border);
      padding: 8px 0;
    }
    .total {
      margin-top: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }
    .notice {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      display: none;
      font-size: 0.92rem;
    }
    .notice.good { background: #ebf8ef; color: var(--good); }
    .notice.warn { background: var(--warn-bg); color: var(--warn); }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Pastry Ordering Assistant</h1>
      <p class="subtitle">Build your order quickly and submit a request with one click.</p>

      <div class="grid" id="menuGrid">
        {% for item in menu_items %}
        <article class="item" data-id="{{ item.id }}" data-price="{{ item.price }}">
          <h3>{{ item.name }}</h3>
          <p class="price">${{ item.price }}</p>
          <div class="qty-controls">
            <button type="button" data-action="decrease">−</button>
            <span class="qty-badge" id="qty-{{ item.id }}">0</span>
            <button type="button" data-action="increase">+</button>
          </div>
        </article>
        {% endfor %}
      </div>

      <div class="field">
        <label for="size">Cake size preference</label>
        <select id="size">
          <option value="Small">Small (6")</option>
          <option value="Medium">Medium (8")</option>
          <option value="Large">Large (10")</option>
        </select>
      </div>
      <div class="field">
        <label for="pickupDate">Pickup date</label>
        <input id="pickupDate" type="date" min="{{ today }}" />
      </div>
      <div class="field">
        <label for="name">Customer name</label>
        <input id="name" type="text" placeholder="Your full name" />
      </div>
      <div class="field">
        <label for="notes">Decoration or flavor notes</label>
        <textarea id="notes" placeholder="Theme, colors, flavor choices, custom text..."></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="submitOrder">Submit Request</button>
        <button class="btn btn-secondary" id="resetOrder" type="button">Reset</button>
      </div>
      <div class="notice" id="notice"></div>
    </section>

    <aside class="card">
      <h2>Order Summary</h2>
      <ul class="summary-list" id="summaryList">
        <li><span>No items selected.</span><strong>—</strong></li>
      </ul>
      <div class="total">
        <span>Total</span>
        <span id="totalPrice">$0.00</span>
      </div>
    </aside>
  </main>

  <script>
    const menuItems = {{ menu_items|tojson }};
    const quantities = Object.fromEntries(menuItems.map(item => [item.id, 0]));

    const menuGrid = document.getElementById("menuGrid");
    const summaryList = document.getElementById("summaryList");
    const totalPrice = document.getElementById("totalPrice");
    const notice = document.getElementById("notice");

    const currency = amount => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(amount);

    function renderSummary() {
      let total = 0;
      const lines = [];

      for (const item of menuItems) {
        const qty = quantities[item.id];
        if (qty <= 0) continue;
        const lineTotal = item.price * qty;
        total += lineTotal;
        lines.push(`<li><span>${item.name} × ${qty}</span><strong>${currency(lineTotal)}</strong></li>`);
      }

      summaryList.innerHTML = lines.length
        ? lines.join("")
        : "<li><span>No items selected.</span><strong>—</strong></li>";

      totalPrice.textContent = currency(total);
    }

    function updateQtyBadge(id) {
      document.getElementById(`qty-${id}`).textContent = quantities[id];
    }

    menuGrid.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const card = event.target.closest(".item");
      if (!card) return;

      const id = card.dataset.id;
      const action = button.dataset.action;

      if (action === "increase") quantities[id] += 1;
      if (action === "decrease") quantities[id] = Math.max(0, quantities[id] - 1);

      updateQtyBadge(id);
      renderSummary();
    });

    function showNotice(message, good = true) {
      notice.textContent = message;
      notice.className = `notice ${good ? "good" : "warn"}`;
      notice.style.display = "block";
    }

    async function submitOrder() {
      const payload = {
        name: document.getElementById("name").value.trim(),
        pickupDate: document.getElementById("pickupDate").value,
        size: document.getElementById("size").value,
        notes: document.getElementById("notes").value.trim(),
        quantities,
      };

      const response = await fetch("/api/quote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await response.json();
      showNotice(data.message, response.ok);
    }

    function resetForm() {
      for (const item of menuItems) {
        quantities[item.id] = 0;
        updateQtyBadge(item.id);
      }
      document.getElementById("size").value = "Small";
      document.getElementById("pickupDate").value = "";
      document.getElementById("name").value = "";
      document.getElementById("notes").value = "";
      notice.style.display = "none";
      renderSummary();
    }

    document.getElementById("submitOrder").addEventListener("click", submitOrder);
    document.getElementById("resetOrder").addEventListener("click", resetForm);

    renderSummary();
  </script>
</body>
</html>
