<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastry Order App</title>
  <style>
    :root {
      --bg: #fff7fb;
      --card: #ffffff;
      --text: #3a2b35;
      --muted: #7d6675;
      --accent: #d8579a;
      --accent-soft: #fce4f2;
      --line: #f3d6e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #fff9fd 0%, #fff3f9 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(960px, 92vw);
      margin: 2rem auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2vw, 2.1rem);
    }

    .subtitle {
      margin-top: 0.4rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 8px 28px rgba(216, 87, 154, 0.08);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-top: 0.9rem;
    }

    .product {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.75rem;
      background: #fff;
    }

    .product h3 {
      margin: 0;
      font-size: 1rem;
    }

    .price {
      font-weight: 700;
      color: var(--accent);
      margin: 0.2rem 0 0.7rem;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="number"],
    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid #e8d7e4;
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      font: inherit;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    button.secondary {
      background: var(--accent-soft);
      color: #8a2f62;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.9rem;
      flex-wrap: wrap;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      border-bottom: 1px dashed #f1d8e7;
      gap: 0.5rem;
    }

    .summary-item:last-child {
      border-bottom: 0;
    }

    .total {
      margin-top: 0.8rem;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
    }

    .meta {
      margin-top: 1rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.95rem;
    }

    .empty {
      color: var(--muted);
      font-style: italic;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .products { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Pastry Ordering App</h1>
    <p class="subtitle">Create quick orders for soft icing cakes, fondant cakes, cupcakes, macarons, and cake pops.</p>

    <section class="grid">
      <div class="card">
        <h2>Choose items</h2>
        <div id="products" class="products"></div>

        <div class="card" style="margin-top: 1rem; background: #fffdfd;">
          <h3>Order details</h3>
          <label>
            Customer name
            <input id="customerName" type="text" placeholder="e.g., Sarah" />
          </label>
          <label style="display:block; margin-top:0.7rem;">
            Pickup date
            <input id="pickupDate" type="text" placeholder="e.g., 2026-04-02" />
          </label>
          <label style="display:block; margin-top:0.7rem;">
            Notes
            <textarea id="notes" placeholder="Flavor, colors, theme, allergies, etc."></textarea>
          </label>

          <div class="actions">
            <button id="generateOrder">Generate Order Summary</button>
            <button class="secondary" id="clearAll">Clear</button>
          </div>
        </div>
      </div>

      <aside class="card">
        <h2>Order summary</h2>
        <div id="summaryList">
          <p class="empty">No items selected yet.</p>
        </div>
        <div class="total">
          <span>Total</span>
          <span id="total">$0.00</span>
        </div>
        <div id="meta" class="meta"></div>
      </aside>
    </section>
  </main>

  <script>
    const pastries = [
      { id: 'soft_icing_cake', name: 'Soft Icing Cake', price: 45 },
      { id: 'fondant_icing_cake', name: 'Fondant Icing Cake', price: 55 },
      { id: 'cupcakes', name: 'Cupcakes (Box of 6)', price: 18 },
      { id: 'macarons', name: 'Macarons (Box of 12)', price: 24 },
      { id: 'cakepops', name: 'Cake Pops (Set of 6)', price: 16 }
    ];

    const productsContainer = document.getElementById('products');
    const summaryList = document.getElementById('summaryList');
    const totalEl = document.getElementById('total');
    const metaEl = document.getElementById('meta');

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
      }).format(value);
    }

    function renderProducts() {
      productsContainer.innerHTML = pastries.map(item => `
        <article class="product">
          <h3>${item.name}</h3>
          <p class="price">${formatCurrency(item.price)}</p>
          <div class="qty-row">
            <label for="qty_${item.id}">Qty</label>
            <input id="qty_${item.id}" min="0" value="0" type="number" />
          </div>
        </article>
      `).join('');
    }

    function createOrder() {
      const lines = [];
      let total = 0;

      pastries.forEach(item => {
        const qty = Number(document.getElementById(`qty_${item.id}`).value || 0);
        if (qty > 0) {
          const subtotal = qty * item.price;
          total += subtotal;
          lines.push({
            label: `${item.name} x ${qty}`,
            subtotal
          });
        }
      });

      if (!lines.length) {
        summaryList.innerHTML = '<p class="empty">No items selected yet.</p>';
        totalEl.textContent = formatCurrency(0);
        metaEl.textContent = '';
        return;
      }

      summaryList.innerHTML = lines.map(line => `
        <div class="summary-item">
          <span>${line.label}</span>
          <strong>${formatCurrency(line.subtotal)}</strong>
        </div>
      `).join('');

      totalEl.textContent = formatCurrency(total);

      const name = document.getElementById('customerName').value.trim();
      const pickupDate = document.getElementById('pickupDate').value.trim();
      const notes = document.getElementById('notes').value.trim();

      metaEl.innerHTML = `
        <div><strong>Customer:</strong> ${name || 'Not provided'}</div>
        <div><strong>Pickup date:</strong> ${pickupDate || 'Not provided'}</div>
        <div><strong>Notes:</strong> ${notes || 'None'}</div>
      `;
    }

    function clearOrder() {
      pastries.forEach(item => {
        document.getElementById(`qty_${item.id}`).value = 0;
      });
      document.getElementById('customerName').value = '';
      document.getElementById('pickupDate').value = '';
      document.getElementById('notes').value = '';
      createOrder();
    }

    document.getElementById('generateOrder').addEventListener('click', createOrder);
    document.getElementById('clearAll').addEventListener('click', clearOrder);

    renderProducts();
    createOrder();
  </script>
</body>
</html>
